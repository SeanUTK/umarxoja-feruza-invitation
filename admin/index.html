<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wedding RSVP Admin</title><style>
:root{--navy:#071d49;--gold:#c9a34e;--ivory:#f8f3e8;--ink:#1d2940;--muted:#716b63;--yes:#1f7a4f;--no:#9c3d3d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8f3e8,#fffdf7);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif}.shell{max-width:1180px;margin:auto;padding:38px 20px 70px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}.kicker{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:800}h1{margin:8px 0 0;font-family:Georgia,serif;font-size:clamp(2rem,5vw,4rem);font-weight:500;color:var(--navy)}.sub{color:var(--muted);margin-top:10px}.refresh{border:1px solid rgba(7,29,73,.2);background:#fff;padding:12px 16px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--navy)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid rgba(201,163,78,.28);border-radius:22px;padding:24px;box-shadow:0 16px 40px rgba(7,29,73,.06)}.label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}.value{margin-top:10px;font-size:clamp(2.2rem,5vw,4rem);font-family:Georgia,serif;color:var(--navy)}.yes .value{color:var(--yes)}.no .value{color:var(--no)}.panel{margin-top:20px;background:#fff;border:1px solid rgba(7,29,73,.1);border-radius:24px;overflow:hidden;box-shadow:0 16px 50px rgba(7,29,73,.06)}.panelhead{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:20px 22px;border-bottom:1px solid rgba(7,29,73,.08)}.panelhead h2{margin:0;font-family:Georgia,serif;font-weight:500;color:var(--navy)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:15px 20px;text-align:left;border-bottom:1px solid rgba(7,29,73,.07);font-size:.92rem}th{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-size:.75rem;font-weight:800}.badge.yes{background:#e8f5ee;color:var(--yes)}.badge.no{background:#f9eaea;color:var(--no)}.empty{padding:48px 22px;text-align:center;color:var(--muted)}.status{font-size:.82rem;color:var(--muted)}.error{margin-top:16px;padding:14px 16px;border-radius:14px;background:#fff1f1;color:#8d2f2f;display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.shell{padding:24px 12px 50px}.card{padding:18px}}
</style></head><body><div class="shell"><div class="top"><div><div class="kicker">Umarxo’ja & Feruzaxon</div><h1>RSVP Admin</h1><div class="sub">Real-time javoblar. Login va parol yo‘q.</div></div><button class="refresh" id="refresh">Yangilash</button></div><div class="grid"><div class="card"><div class="label">Jami javob</div><div class="value" id="total">0</div></div><div class="card yes"><div class="label">Kelaman</div><div class="value" id="yes">0</div></div><div class="card no"><div class="label">Kela olmayman</div><div class="value" id="no">0</div></div><div class="card"><div class="label">Kelish foizi</div><div class="value" id="rate">0%</div></div></div><div class="error" id="error"></div><section class="panel"><div class="panelhead"><h2>Guest responses</h2><div class="status" id="status">Loading…</div></div><div class="tablewrap"><table><thead><tr><th>Mehmon</th><th>Javob</th><th>Oxirgi update</th><th>ID</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>Hozircha javob yo‘q.</div></div></section></div><script>
const API_URL="https://ckftwezdvbsotapcpehk.supabase.co/rest/v1/wedding_rsvps",API_KEY="sb_publishable_zpZewz3b9u8B87TYiKmbWw_pxLHgnBb";const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=d=>{try{return new Intl.DateTimeFormat('ru-RU',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d))}catch{return d||''}};async function load(){$('#status').textContent='Yangilanmoqda…';$('#error').style.display='none';try{const r=await fetch(API_URL+'?select=id,guest_key,guest_name,response,updated_at&order=updated_at.desc',{headers:{apikey:API_KEY,Authorization:'Bearer '+API_KEY}});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const yes=data.filter(x=>x.response==='yes').length,no=data.filter(x=>x.response==='no').length,total=data.length;$('#total').textContent=total;$('#yes').textContent=yes;$('#no').textContent=no;$('#rate').textContent=total?Math.round(yes/total*100)+'%':'0%';$('#rows').innerHTML=data.map(x=>`<tr><td><strong>${esc(x.guest_name||'aziz mehmon')}</strong></td><td><span class="badge ${x.response}">${x.response==='yes'?'Kelaman':'Kela olmayman'}</span></td><td>${esc(fmt(x.updated_at))}</td><td>${esc((x.guest_key||'').slice(0,8))}</td></tr>`).join('');$('#empty').hidden=!!data.length;$('#status').textContent='Oxirgi update: '+new Date().toLocaleTimeString('ru-RU');}catch(e){console.error(e);$('#status').textContent='Xatolik';$('#error').style.display='block';$('#error').textContent='Database bilan ulanishda xatolik.';}}$('#refresh').addEventListener('click',load);load();setInterval(load,10000);
</script></body></html>
